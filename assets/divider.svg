<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0" />
      <stop offset="20%" stop-color="#e11d48" stop-opacity="0.2" />
      <stop offset="48%" stop-color="#e11d48" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff2a4b" stop-opacity="1" />
      <stop offset="52%" stop-color="#e11d48" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#e11d48" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </linearGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Line -->
  <line x1="80" y1="12.0" x2="1120" y2="12.0" stroke="url(#div-grad)" stroke-width="1.4" />

  <!-- Center Diamond & Pixel Accents -->
  <g transform="translate(600.0, 12.0)" filter="url(#div-glow)">
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#ff2a4b" />
    <circle cx="-16" cy="0" r="1.8" fill="#e11d48" opacity="0.9" />
    <circle cx="16" cy="0" r="1.8" fill="#e11d48" opacity="0.9" />
    <circle cx="-28" cy="0" r="1.2" fill="#ffe066" opacity="0.8" />
    <circle cx="28" cy="0" r="1.2" fill="#ffe066" opacity="0.8" />
  </g>
</svg>