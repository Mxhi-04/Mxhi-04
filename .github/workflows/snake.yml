name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e11d48&color_dots=#ebedf0,#fecdd3,#fda4af,#fb7185,#e11d48
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff2a4b&color_dots=#080406,#2a0910,#5c0c1b,#990f26,#e11d48
            
      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
